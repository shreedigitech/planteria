<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061506">
<title>My Profile — Plantia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"DM Sans";background:#061506;color:#fff;min-height:100vh;padding:30px 0}.container{width:min(1050px,92%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.logo{font-size:22px;font-weight:700}.logo span{color:#b8df9f}a{color:#b8df9f;text-decoration:none}.glass{background:rgba(31,61,31,.38);border:1px solid rgba(255,255,255,.12);box-shadow:0 20px 60px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.07);backdrop-filter:blur(18px)}.hero{padding:35px;border-radius:30px;margin-bottom:20px}.hero h1{font-family:"Playfair Display";font-size:45px}.hero p{color:#8fa18c;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.box{border-radius:28px;padding:25px}.box h2{font-family:"Playfair Display";font-size:30px;margin-bottom:20px}.detail{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)}.detail span{display:block;color:#80947e;font-size:12px;margin-bottom:4px}.order{padding:16px 0;border-bottom:1px solid rgba(255,255,255,.08)}.btn{display:inline-block;padding:12px 18px;border-radius:30px;background:#b8df9f;color:#092009;font-weight:700;margin-top:18px}.empty{color:#81957f}.item{display:flex;gap:12px;margin-top:10px}.item img{width:55px;height:55px;object-fit:contain;border-radius:10px;background:#102610}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero{padding:24px}.hero h1{font-size:36px}.top{gap:15px;align-items:flex-start}}
</style>
</head>
<body>
<div class="container">
<div class="top"><div class="logo">🌿 Plant<span>ia</span></div><a href="/">← Home</a></div>
<section class="hero glass"><h1 id="welcome">My Profile</h1><p>Your saved delivery details and Plantia order history.</p></section>
<div class="grid">
<section class="box glass"><h2>Personal & Delivery Details</h2><div id="details"></div><a class="btn" href="/checkout.html">Edit / Checkout</a></section>
<section class="box glass"><h2>Order History</h2><div id="orders"></div></section>
</div>
</div>
<script>
function money(n){return "₹"+Number(n).toLocaleString("en-IN")}
const profile=JSON.parse(localStorage.getItem("plantiaProfile")||"null");
const orders=JSON.parse(localStorage.getItem("plantiaOrders")||"[]");
if(profile){
document.getElementById("welcome").textContent="Hello, "+profile.name;
document.getElementById("details").innerHTML=[
["Name",profile.name],["Phone",profile.phone],["Email",profile.email],["Address",profile.address],
["City",profile.city],["State",profile.state],["PIN Code",profile.pincode],["Landmark",profile.landmark||"—"]
].map(x=>`<div class="detail"><span>${x[0]}</span>${x[1]||"—"}</div>`).join("");
}else{
document.getElementById("details").innerHTML='<div class="empty">No profile details saved yet. Complete your first checkout to save them automatically.</div>';
}
const ordersBox=document.getElementById("orders");
if(!orders.length){ordersBox.innerHTML='<div class="empty">No completed orders yet.</div>'}
else{
ordersBox.innerHTML=orders.map(o=>`
<div class="order">
<strong>${o.orderId}</strong>
<div style="color:#b8df9f;margin:6px 0">${money(o.amount)} · Payment Verified</div>
<div style="color:#81957f;font-size:12px">${new Date(o.date).toLocaleString("en-IN")}</div>
${(o.items||[]).map(i=>`<div class="item"><img src="${i.image}" alt=""><div>${i.name}<br><small style="color:#81957f">Qty ${i.quantity}</small></div></div>`).join("")}
</div>`).join("");
}
</script>
</body>
</html>
